<html lang="en">

    <h1>Calculator Simple</h1>
    <form>
      <label>number 1</label> <br>
      <input type = "number" id = "calculator" placeholder="masukkan angka"> <br>
      <label>number 2</label> <br>
      <input type = "number" id = "calculator" placeholder="masukkan angka"> <br>
      <br>
      <button type ="button">+</button>
      <button type ="button">-</button>
      <button type ="button">×</button>
      <button type ="button">/</button> <br>

      <label>Result</label>
      <br>
      <button type="button" onclick="tampilkanhasil(0)"></button>

  </body>
  <script>
  
        function hitung(op) {
            let a = parseFloat(document.getElementById('num1').value);
            let b = parseFloat(document.getElementById('num2').value);
            let res = 0;

            if (isNaN(a) || isNaN(b)) {
                document.getElementById('result').innerText = "Masukkan angka!";
                return;
            }

            if (op === '+') res = a + b;
            else if (op === '-') res = a - b;
            else if (op === '*') res = a * b;
            else if (op === '/') res = b !== 0 ? a / b : "Cannot divide by 0";

            document.getElementById('result').innerText = res;
        }
    </script>
